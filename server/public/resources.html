<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LTI Deep Linking Resource Picker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2em;
    }
    label, select, button {
      display: block;
      margin-bottom: 1em;
    }
    #description {
      margin-top: -0.5em;
      margin-bottom: 1.5em;
      font-style: italic;
      color: #555;
    }
  </style>
</head>
<body>

  <label for="resourceSelect">Available Concord Consortium Resources:</label>
  <select id="resourceSelect" style="padding: 5px; width: 100%;">
    <!-- Options will be populated via JavaScript -->
  </select>

  <div id="description" style="padding: 10px 0;">Loading resources...</div>

  <div id="customFields" hidden style="border: 1px solid #ccc; padding: 1em; margin-bottom: 1em;">
    <label for="documentInput">CODAP share link or document URL:</label>
    <input id="documentInput" type="text" style="width: 100%; padding: 5px; box-sizing: border-box; display: block;"
           placeholder="https://codap3.concord.org/#shared=... or https://.../document.json">
    <div style="font-size: 12px; color: #555; margin: 0.4em 0 1em;">
      In CODAP: Share &gt; Get link, then paste the link here. Google Drive links will not work; the document must be reachable by URL.
    </div>
    <label for="titleInput">Title (optional; defaults to the document's name):</label>
    <input id="titleInput" type="text" style="width: 100%; padding: 5px; box-sizing: border-box; display: block; margin-bottom: 1em;">
    <button id="checkBtn" type="button">Check document</button>
    <div id="checkResult" style="font-size: 13px; margin-top: 0.5em;"></div>
  </div>

  <button id="selectBtn">Select</button>

  <script>
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    const ltik = getQueryParam("ltik");
    if (!ltik) {
      alert("Missing required ltik query parameter.");
      throw new Error("ltik parameter is required.");
    }

    const selectEl = document.getElementById('resourceSelect');
    const descriptionEl = document.getElementById('description');
    let resources = [];

    function updateDescriptionBySlug(slug) {
      const resource = resources.find(r => r.slug === slug);
      if (resource && resource.description) {
        descriptionEl.textContent = resource.description;
      } else {
        descriptionEl.textContent = "No description available.";
      }
    }

    function humanizeTag(tag) {
      return tag
        .replace(/-/g, " ")
        .replace("ngss", "NGSS")
        .replace("dev", "Development")
        .replace(/\b\w/g, c => c.toUpperCase());
    };

    // Fetch resources using the ltik param
    fetch(`/resources?ltik=${encodeURIComponent(ltik)}`)
      .then(response => {
        if (!response.ok) throw new Error("Failed to fetch resources.");
        return response.json();
      })
      .then(data => {
        if (!Array.isArray(data) || data.length === 0) {
          throw new Error("No resources returned from the server.");
        }

        resources = data;

        // Map of tag name → array of resources
        const grouped = {};

        resources.forEach(resource => {
          resource.tags.forEach(tag => {
            if (!grouped[tag]) {
              grouped[tag] = [];
            }
            grouped[tag].push(resource);
          });
        });

        // Sort tags alphabetically
        const sortedTagNames = Object.keys(grouped).sort((a, b) => a.localeCompare(b));

        // Clear select in case it's reused
        selectEl.innerHTML = '';

        // Add optgroups with sorted resources
        sortedTagNames.forEach(tagName => {
          const group = document.createElement('optgroup');
          group.label = humanizeTag(tagName);

          const sortedResources = grouped[tagName].sort((a, b) =>
            a.title.localeCompare(b.title)
          );

          sortedResources.forEach(resource => {
            const option = document.createElement('option');
            option.value = resource.slug;
            option.textContent = resource.title;
            group.appendChild(option);
          });

          selectEl.appendChild(group);
        });

        // Set initial description
        updateDescriptionBySlug(selectEl.value);
        updateCustomVisibility();
      })
      .catch(err => {
        console.error("Error fetching resources:", err);
        descriptionEl.textContent = "Error loading resource list.";
      });

    // ---- custom CODAP document ----
    const customFields = document.getElementById('customFields');
    const documentInput = document.getElementById('documentInput');
    const titleInput = document.getElementById('titleInput');
    const checkResult = document.getElementById('checkResult');
    let checkedInput = null; // the input value that last passed "Check document"

    function isCustomSelected() { return selectEl.value === "codap-custom"; }
    function updateCustomVisibility() {
      customFields.hidden = !isCustomSelected();
      document.getElementById('selectBtn').disabled = isCustomSelected() && checkedInput !== documentInput.value.trim();
    }
    documentInput.addEventListener('input', () => { checkResult.textContent = ""; updateCustomVisibility(); });

    document.getElementById('checkBtn').addEventListener('click', async () => {
      checkResult.textContent = "Checking…";
      try {
        const r = await fetch(`/codap/check-document?ltik=${encodeURIComponent(ltik)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-codap-state' }, // raw-body route
          body: JSON.stringify({ input: documentInput.value })
        });
        const j = await r.json();
        if (j.ok) {
          checkedInput = documentInput.value.trim();
          if (!titleInput.value && j.title) titleInput.value = j.title;
          checkResult.innerHTML = `<span style="color:#070">Looks good: a CODAP document${j.title ? ` named "${escapeHtml(j.title)}"` : ""}.</span>`;
        } else {
          checkedInput = null;
          checkResult.innerHTML = `<span style="color:#a00">${escapeHtml(j.error || "Could not load that document.")}</span>`;
        }
      } catch (e) {
        checkedInput = null;
        checkResult.innerHTML = `<span style="color:#a00">Check failed: ${escapeHtml(e.message)}</span>`;
      }
      updateCustomVisibility();
    });
    function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

    selectEl.addEventListener('change', () => {
      updateDescriptionBySlug(selectEl.value);
      updateCustomVisibility();
    });

    document.getElementById('selectBtn').addEventListener('click', () => {
      const selectedSlug = selectEl.value;
      const selected = resources.find(r => r.slug === selectedSlug);

      if (!selected) {
        alert("Please select a valid resource.");
        return;
      }

      const resourcePayload = {
        title: isCustomSelected() ? (titleInput.value.trim() || selected.title) : selected.title,
        url: "/launch",
        slug: selected.slug,
        documentInput: isCustomSelected() ? documentInput.value.trim() : undefined,
        ltik: ltik
      };

      fetch('/deeplink', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(resourcePayload)
      })
      .then(async response => {
        if (!response.ok) {
          const j = await response.json().catch(() => ({}));
          throw new Error(j.details?.message || `Server returned ${response.status}`);
        }
        return response.text();
      })
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(err => {
        console.error("Error during deeplink POST:", err);
        alert("There was an error selecting the resource.");
      });
    });
  </script>

</body>
</html>
